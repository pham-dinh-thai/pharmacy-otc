name: pharmacy-otc

services:
  postgresql:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgre_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

  nginx:
    image: nginx:stable-alpine3.24
    # host network: nginx thấy backend/frontend đang chạy trên host (127.0.0.1:3000/3001)
    # và bind thẳng port 80 của host. Chỉ dùng cho Linux.
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgre_data:
  redis_data:
  redisinsight_data:
