services:
  backend:
    image: pharmacy-otc-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: pharmacy-otc-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      BACKEND_URL: http://nginx/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
